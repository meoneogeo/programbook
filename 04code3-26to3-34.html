  <script>

    //--Code 3-26-----------------------

    //--Code 3-27-----------------------

    console.log("สมาชิกตัวที่สองคือ" + a[1]);

    for (var i = 0; i < a.length; i++) {
      console.log("สมาชิกตัวที่ " + (i + 1) + " คือ " + a[i]);
    }

    //--Code 3-29-----------------------
    var a = [14, 20, 32, 47, 58];
    for (var i in a) {
      console.log("สมาชิกตัวที่ " + (parseInt(i) + 1) + " คือ " + a[i]);
    }

    //--Code 3-30-----------------------
    var a = [45, 20, 2, 87, 13];
    console.log(a.indexOf(87));

    var a = [45, 20, 2, 87, 13];
    a.sort();
    console.log(a);

    var a = ["Apple", "Orange", "Banana"];
    a.sort();
    console.log(a);

    var a = [45, 20, 2, 87, 13];
    a.reverse();
    console.log(a);

    var a = [45, 20, 2, 87, 13];
    a.fill(55);
    console.log(a);

    var a = [45, 20, 2, 87, 13];
    a.push(2, 56, 43);
    console.log(a);

    var a = [45, 20, 2, 87, 13];

    var a = [45, 20, 2, 87, 13];

    var b = [...a];

    //--Code 3-32-----------------------
    var img = [
      [12, 23, 67, 124, 155],
      [45, 89, 90, 129, 145],
      [45, 76, 97, 110, 154],
      [47, 56, 90, 130, 176],
      [54, 57, 101, 121, 178],
    ];

    for (var i = 0; i < img.length; i++) {
      for (var j = 0; j < img[i].length; j++) {
        document.write(img[i][j] * 2 + " ");
      }
      document.write("<br>");
    }


    //--Code 3-34-----------------------
    var nir = [
      [100, 243, 50, 45, 22, 190],
      [200, 32, 145, 34, 112, 32],
      [45, 222, 1, 3, 43, 10],
      [45, 32, 4, 3, 5, 22],
      [67, 54, 56, 33, 56, 32],
    ];

    var red = [
      [10, 45, 43, 45, 100, 70],
      [100, 45, 200, 33, 72, 10],
      [56, 22, 100, 134, 143, 100],
      [45, 132, 40, 13, 65, 220],
      [44, 44, 34, 35, 14, 67],
    ];

    for (var i = 0; i < nir.length; i++) {
      for (var j = 0; j < nir[i].length; j++) {
        var ndvi = (nir[i][j] - red[i][j]) / (nir[i][j] + red[i][j]);
        var ndvi_1 = ndvi.toFixed(2);
        document.write(ndvi_1 + " ");
      }
      document.write("<br>");
    }

  </script>
</body>
