<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
</head>

<body>
  <script>

    //-- Code 3-1-------
    console.log('Hello World!');

    //--Code 3-2--------
    //Comment for Javascript
    /* Multiple Line Comment
        บรรทัดนี้ไม่ถูกประมวลผล
    */
    console.log('Hello World!');
    document.write('Hello World!');


    //--Code 3-3----------
    console.log('Hello World!');
    document.write('Hello World!');
    alert('Hello World!');

    //--Code 3-4----------
    var myVar = "Hello Javascript";
    console.log(myVar);
    var myNumber1 = 10;
    var myNumber2 = 20;
    console.log(myNumber1);
    console.log(myNumber2);
    var myVar = myNumber1 + myNumber2;
    console.log(myVar);

    var myText = "John" + " " + "Wick";
    console.log(myText);
    var x = "5" + 2 + 3;
    console.log(x);

    var y;
    y = "Javascript" + 101;
    console.log(y);


    //--Code 3-5---------------
    var a = true;
    var b = false;
    console.log(a);
    console.log(b);

    //--Code 3-6---------------
    var c = undefined;
    var d = null;
    console.log(c);
    console.log(d);

    //--Code 3-7---------------
    var a = 200;
    var b = 30.432;
    var c = "Cat";
    var d = true;
    var e;

    console.log(typeof a);
    console.log(typeof b);
    console.log(typeof c);
    console.log(typeof d);
    console.log(typeof e);


    //--Code 3-8---------------
    let aa = 1;
    var bb = 3;
    const cc = 20;
    console.log(aa);
    console.log(bb);
    console.log(cc);
    cc = 24;


    //--Code 3-9---------------
    var a = 10 + 30;
    var b = 30 - 4;
    var c = 4 * 5;
    var d = 50 / 2;
    var e = 40 % 3;

    console.log(a);
    console.log(b);
    console.log(c);
    console.log(d);
    console.log(e);

    //--Code 3-10---------------
    var a = 1;
    a = a + 1;
    console.log(a);
    a += 1;
    console.log(a);

    var b = 4;
    b -= 3;
    console.log(b);

    var c = 10;
    c *= 4;
    console.log(c);

    var d = 60;
    d /= 9;
    console.log(d);

    var e = 54;
    e %= 5;
    console.log(e);


    //--Code 3-11---------------
    var a = 10;
    a++;
    console.log(a);
    a--;
    console.log(a);


    //--Code 3-12---------------
    var a = 20;
    var b = 10;
    var c = 20;
    console.log(a == b);
    console.log(a != b);
    console.log(a > b);
    console.log(a < b);
    console.log(a >= b);
    console.log(a <= b);

    console.log(a == c);
    console.log(a != c);
    console.log(a > c);
    console.log(a < c);
    console.log(a >= c);
    console.log(a <= c);


    //--Code 3-13---------------
    var a = 10;
    var b = 20;
    var c = 10;
    var d = 30;
    console.log(a > 5 && b < 30); //true && true
    console.log(a > b && a < c); //false && false
    console.log(a > b && c < d); //false && true
    console.log(a < b && c > d); //true && false

    console.log(a > 5 || b < 30); //true || true
    console.log(a > b || a < c); //false || false
    console.log(a > b || c < d); //false || true
    console.log(a < b || c > d); //true || false

    console.log(!(a > b || c < d)); //false || true
  </script>
</body>

</html>
