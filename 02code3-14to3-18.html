  <script>

    //--Code 3-16---------------
    var a = 65;
    if (a < 50) {
      console.log("ตัวแปร a มีค่าน้อยกว่าหรือเท่ากับ 50");
    } else {
      console.log("ตัวแปร a มีค่ามากกว่า 50");
    }

    //--Code 3-17---------------
    var a = 65;
    if (a >= 80) {
      console.log("คุณได้เกรด A");

      console.log("คุณได้เกรด B");
    } else if (a < 70 && a >= 50) {
      console.log("คุณได้เกรด C");
    } else if (a < 50 && a >= 40) {
      console.log("คุณได้เกรด D");

      console.log("คุณได้เกรด F");
    }

        console.log("ท่านให้คะแนน 1");

        console.log("ท่านให้คะแนน 2");

      case 3:
        console.log("ท่านให้คะแนน 3");
        break;

        break;
      case 5:
        console.log("ท่านให้คะแนน 5");
        break;
      default:
        console.log("ท่านให้คะแนนผิด กรุณากรอกเลข 1-5");
    }
