        class PointGeoJSON {
            constructor(geoJSON) {
                this.geoJSON = geoJSON;
                if (
                    this.geoJSON.features[0].geometry.type != "Point" &&
                    this.geoJSON.features[0].geometry.type != "MultiPoint"
                ) {
                    throw "This is not Point or MultiPoint data.";
                }
            }

            get geoJSONData() {
                return this.geoJSON;
            }

            get coordinate() {
                var coors = this.geoJSON.features.map((item) => {
                    return item.geometry.coordinates;
                });
                return coors;
            }

            listProp(keyName) {
                let keyObjects = Object.keys(this.geoJSON.features[0].properties);
                let checkKey = keyObjects.filter((item) => {
                    return item == keyName;
                });
                if (checkKey.length > 0) {
                    var namePoint = this.geoJSON.features.map((item) => {
                        return item.properties[keyName];
                    });
                    return namePoint;
                } else {
                    throw "There is no key available in the properties.";
                }
            }

            addValueToProp(keyName, value) {
                let keyObjects = Object.keys(this.geoJSON.features[0].properties);
                let checkKey = keyObjects.filter((item) => {
                    return item == keyName;
                });
                if (checkKey.length > 0) {
                    throw "The key name is not available";
                } else {
                    for (let i in this.geoJSON.features) {
                        this.geoJSON.features[i].properties[keyName] = value;
                    }
                }
            }
        }
